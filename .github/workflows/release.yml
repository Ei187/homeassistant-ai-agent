name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ai_agent.zip for HACS and Direct Updates
        run: |
          cd custom_components
          zip -r ../ai_agent.zip ai_agent
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Agent Pro ${{ github.ref_name }}
          generate_release_notes: true
          files: ai_agent.zip
